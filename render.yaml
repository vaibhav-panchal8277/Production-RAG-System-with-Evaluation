# Render Blueprint for the FastAPI backend (Dashboard → New → Blueprint).
# The React UI is deployed separately on Vercel (see DEPLOY.md).
#
# Values marked `sync: false` are secrets: Render asks for them when the
# Blueprint is created and never reads them from this file.
services:
  - type: web
    name: rag-eval-api
    runtime: docker
    plan: free            # 512 MB / 0.1 CPU; sleeps after 15 min idle
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/
    autoDeploy: true
    # Frontend-only commits don't rebuild the API image.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # ---- secrets (entered in the Render dashboard) ----
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: MONGO_URL          # mongodb+srv://… from MongoDB Atlas
        sync: false
      - key: CORS_ORIGINS       # your Vercel URL, e.g. https://rag-eval.vercel.app
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      # Admin key for upload/seed/delete/eval/history. Render generates a
      # random value; copy it from the dashboard, never into the frontend.
      - key: RAG_API_KEY
        generateValue: true

      # ---- public demo mode ----
      - key: PUBLIC_QUERY
        value: "true"
      - key: QUERY_RATE_PER_MIN
        value: "10"
      - key: QUERY_GLOBAL_RATE_PER_MIN
        value: "25"

      # ---- non-secret config ----
      - key: DB_NAME
        value: rag_eval
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: PINECONE_INDEX
        value: rag-eval-index
      - key: PINECONE_NAMESPACE
        value: prod
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com
      # Lower parallelism keeps an eval run inside 512 MB and Groq's free limits.
      - key: EVAL_CONCURRENCY
        value: "2"
      - key: EVAL_RAGAS_WORKERS
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "5"
