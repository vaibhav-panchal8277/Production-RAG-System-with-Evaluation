name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip uninstall -y torch
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Lint
        run: |
          pip install ruff
          ruff check backend
      - name: Pytest
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: rag_eval_ci
          # Integration tests are skipped in CI unless real keys are provided
        run: |
          cd backend && pytest -q -k "not integration" || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        run: cd frontend && yarn install --frozen-lockfile || yarn install
      - name: Build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "http://localhost:8001"
        run: cd frontend && yarn build
