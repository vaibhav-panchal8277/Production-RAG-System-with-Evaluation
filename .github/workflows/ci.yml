name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      # Each run writes to its own namespace of the shared index, so CI never
      # touches dev data or a concurrent run's vectors. Deleted at the end.
      PINECONE_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Free up disk space
        run: |
          sudo apt-get clean
          sudo apt-get -y autoremove
          docker system prune -af --volumes

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # Gates that need no secrets and must always pass.
      - name: Lint
        run: ruff check backend streamlit_app.py

      - name: Byte-compile
        run: python -m compileall -q backend streamlit_app.py

      - name: Guard against reintroduced provider coupling
        run: |
          if grep -rniE "emergent" backend streamlit_app.py frontend/src frontend/public \
               docker-compose.yml Makefile README.md; then
            echo "::error::Emergent reference reintroduced — this project uses Groq."
            exit 1
          fi

      # No backend URL set, so the integration modules skip themselves.
      - name: Offline tests
        run: cd backend && pytest -q

      - name: Pytest
        if: env.GROQ_API_KEY != '' && env.PINECONE_API_KEY != ''
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: rag_eval_ci
          REACT_APP_BACKEND_URL: http://localhost:8001
          CORS_ORIGINS: http://localhost:3000
        run: |
          cd backend
          uvicorn server:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8001/api/ >/dev/null 2>&1 && break
            sleep 2
          done
          pytest -q

      - name: Delete CI Pinecone namespace
        if: always() && env.PINECONE_API_KEY != ''
        run: |
          python - <<'PY'
          import os
          from pinecone import Pinecone
          pc = Pinecone(api_key=os.environ["PINECONE_API_KEY"])
          index = pc.Index(os.environ.get("PINECONE_INDEX", "rag-eval-index"))
          try:
              index.delete(delete_all=True, namespace=os.environ["PINECONE_NAMESPACE"])
          except Exception as e:  # namespace may never have been created
              print(f"namespace cleanup skipped: {e}")
          PY

      - name: Note skipped tests
        if: env.GROQ_API_KEY == '' || env.PINECONE_API_KEY == ''
        run: |
          echo "::warning::Pytest skipped — set the GROQ_API_KEY and \
          PINECONE_API_KEY repository secrets to run the integration suite."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        run: cd frontend && yarn install --frozen-lockfile
      - name: Build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "http://localhost:8001"
        run: cd frontend && yarn build