name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Empty when the secret is not configured — used to decide whether the
      # live-integration test job can run at all (see the `if:` below).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip uninstall -y torch || true
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1

      # Gates that need no secrets and must always pass.
      - name: Lint
        run: |
          pip install ruff
          ruff check backend

      - name: Byte-compile
        run: python -m compileall -q backend streamlit_app.py

      - name: Guard against reintroduced provider coupling
        run: |
          if grep -rniE "emergent" backend streamlit_app.py frontend/src frontend/public \
               docker-compose.yml Makefile README.md; then
            echo "::error::Emergent reference reintroduced — this project uses Groq."
            exit 1
          fi

      # The suite drives a live server over HTTP and calls Groq + Pinecone, so
      # it can only run where those secrets exist. It is skipped (not silently
      # passed) otherwise — the old `|| true` hid real failures.
      - name: Pytest
        if: env.GROQ_API_KEY != '' && env.PINECONE_API_KEY != ''
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: rag_eval_ci
          REACT_APP_BACKEND_URL: http://localhost:8001
          CORS_ORIGINS: http://localhost:3000
        run: |
          cd backend
          uvicorn server:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8001/api/ >/dev/null 2>&1 && break
            sleep 2
          done
          pytest -q

      - name: Note skipped tests
        if: env.GROQ_API_KEY == '' || env.PINECONE_API_KEY == ''
        run: |
          echo "::warning::Pytest skipped — set the GROQ_API_KEY and \
          PINECONE_API_KEY repository secrets to run the integration suite."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        run: cd frontend && yarn install --frozen-lockfile
      - name: Build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "http://localhost:8001"
        run: cd frontend && yarn build
