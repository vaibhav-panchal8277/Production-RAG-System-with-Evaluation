[pytest]
# Serial on purpose. The integration tests drive ONE running backend with shared
# state (seed, delete, re-seed, eval history), so they must not run in parallel:
# under xdist `--dist loadscope`, test classes of the same module landed on
# different workers, so queries could run before seeding and TestDeleteDoc could
# delete a document while another worker was querying it.
#
# Offline unit tests (no backend needed) run in the same session; integration
# modules skip themselves when REACT_APP_BACKEND_URL is unset.
testpaths = tests
pythonpath = .
